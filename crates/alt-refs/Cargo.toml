[package]
name = "alt-refs"
description = "alt native ref store: transactional ref state replayed from the oplog, with snapshot acceleration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
alt-git-codec.workspace = true
alt-hash.workspace = true
alt-oplog.workspace = true
alt-os.workspace = true

[features]
# the hooks of the log for the tests of this package (see `alt-oplog`)
hooks = ["alt-oplog/hooks"]

[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["hooks"]
