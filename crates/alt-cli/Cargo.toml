[package]
name = "alt-cli"
description = "The alt command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "alt_cli"
path = "src/lib.rs"

[[bin]]
name = "alt"
path = "src/main.rs"

[[bin]]
name = "altd"
path = "src/bin/altd.rs"

[[bin]]
name = "altd-server"
path = "src/bin/altd_server.rs"

[dependencies]
alt-hash.workspace = true
golia-change-link.workspace = true
alt-provenance.workspace = true
alt-portable.workspace = true
alt-command-protocol.workspace = true
alt-delivery.workspace = true
alt-input.workspace = true
alt-task.workspace = true
alt-task-transfer.workspace = true
alt-task-service.workspace = true
alt-remote-protocol.workspace = true
alt-repository-service.workspace = true
alt-runner.workspace = true
alt-diff.workspace = true
alt-git-codec.workspace = true
alt-git-config.workspace = true
alt-git-index.workspace = true
alt-export.workspace = true
alt-flow.workspace = true
alt-git-pack.workspace = true
alt-import.workspace = true
alt-inflate.workspace = true
alt-lfs.workspace = true
alt-merge.workspace = true
alt-odb.workspace = true
alt-oplog.workspace = true
alt-refs.workspace = true
alt-repo.workspace = true
alt-sign.workspace = true
alt-treediff.workspace = true
alt-wire.workspace = true
alt-wire-http.workspace = true
ed25519-dalek.workspace = true
tempfile.workspace = true
tiny_http.workspace = true
alt-worktree.workspace = true
bstr.workspace = true
clap.workspace = true
encoding_rs.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[dev-dependencies]
alt-browser-auth.workspace = true
alt-deflate.workspace = true
alt-server.workspace = true
alt-server-store.workspace = true
postgres = {version="0.19",features=["with-serde_json-1"]}
tokio = {version="1",features=["rt-multi-thread","net","sync"]}
alt-sign.workspace = true
alt-testutil.workspace = true
criterion.workspace = true
tempfile.workspace = true

[[bench]]
name = "daemon_open"
harness = false
