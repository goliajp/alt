# Run from the prepared installation directory; all paths are local to it.
# Container logs carry the access log; rotation keeps them bounded.
x-logging: &logging
  driver: json-file
  options:
    max-size: "${ALT_LOG_FILE_BYTES:-50m}"
    max-file: "${ALT_LOG_FILES:-10}"
services:
  database:
    image: "${ALT_DATABASE_IMAGE:?exact locally loaded image identity required}"
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    mem_limit: "${ALT_DATABASE_MEMORY:-2g}"
    network_mode: none
    environment:
      POSTGRES_DB: alt
      POSTGRES_USER: alt
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
    command: [postgres, -c, "listen_addresses=", -c, "unix_socket_directories=/var/run/postgresql"]
    volumes:
      - postgres:/var/lib/postgresql
      - socket:/var/run/postgresql
      - ./secrets/database-password:/run/secrets/database-password:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h /var/run/postgresql -U alt -d alt"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]

  edge:
    image: "${ALT_EDGE_IMAGE:?exact locally loaded image identity required}"
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    mem_limit: "${ALT_EDGE_MEMORY:-256m}"
    user: "${ALT_UID:?}:${ALT_GID:?}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ALT_FRONT_PROXY: "${ALT_FRONT_PROXY:-}"
    ports:
      - "${ALT_BIND_ADDRESS:-127.0.0.1}:${ALT_HTTPS_PORT:?}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/run/tls:ro
    tmpfs: [/tmp, /data, /config]

  app:
    image: "${ALT_IMAGE:?exact locally loaded image identity required}"
    pull_policy: never
    restart: unless-stopped
    logging: *logging
    mem_limit: "${ALT_MEMORY:-2g}"
    user: "${ALT_UID:?}:${ALT_GID:?}"
    network_mode: service:edge
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Read by `migrate` alone, for a configuration that names no proxy: the
    # edge, which shares this network namespace, and the gateway of the
    # network, which is where a proxy on the host connects to the edge from.
    environment:
      ALT_TRUSTED_PROXIES: "127.0.0.1,::1,${ALT_GATEWAY:-172.30.91.1}"
    depends_on:
      database: {condition: service_healthy}
      edge: {condition: service_started}
    volumes:
      - ./config:/etc/alt:ro
      - ./secrets/receipt.key:/run/alt/receipt.key:ro
      - ./secrets/database:/run/alt/database:ro
      - ./data:/var/lib/alt
      - socket:/var/run/postgresql:ro
    # What the server writes for a time while it serves (request bodies, responses
    # to fetches, the bases of deltas) is under /var/lib/alt/temporary, on the disk
    # of the data: this is for the operator commands, and is memory of the container.
    tmpfs:
      - /tmp:mode=1777,size=${ALT_TEMP_BYTES:-4294967296}
    healthcheck:
      test: [CMD, /usr/local/bin/alt-entrypoint, health]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
# The network of the edge has addresses that are written down, so that the
# gateway a proxy on the host is seen as can be named: in ALT_FRONT_PROXY, and
# in http.trusted_proxies of the configuration.
networks:
  default:
    ipam:
      config:
        - subnet: "${ALT_SUBNET:-172.30.91.0/24}"
          gateway: "${ALT_GATEWAY:-172.30.91.1}"
volumes:
  postgres:
  socket:
