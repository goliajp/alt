[workspace]
resolver = "3"
members = ["crates/*", "vendor/golia-platform-contract", "vendor/golia-change-link", "vendor/golia-change-link-http"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
alt-byte-segment = { path = "crates/alt-byte-segment" }
alt-server-telemetry = { path = "crates/alt-server-telemetry" }
golia-change-link-http = { path = "vendor/golia-change-link-http", version = "=0.1.0" }
golia-change-link = { path = "vendor/golia-change-link", version = "=0.1.0" }
alt-portable = { path = "crates/alt-portable" }
alt-provenance = { path = "crates/alt-provenance" }
golia-platform-contract = { path = "vendor/golia-platform-contract", version = "=0.1.0" }
alt-cloud-client = { path = "crates/alt-cloud-client" }
alt-browser-auth = { path = "crates/alt-browser-auth" }
alt-task-transfer = { path = "crates/alt-task-transfer" }
alt-server = { path = "crates/alt-server" }
alt-command-protocol = { path = "crates/alt-command-protocol" }
alt-task-service = { path = "crates/alt-task-service" }
alt-server-store = { path = "crates/alt-server-store" }
alt-repository-service = { path = "crates/alt-repository-service" }
alt-remote-protocol = { path = "crates/alt-remote-protocol" }
alt-input = { path = "crates/alt-input" }
alt-task = { path = "crates/alt-task" }
alt-runner = { path = "crates/alt-runner" }
alt-delivery = { path = "crates/alt-delivery" }
alt-cdc = { path = "crates/alt-cdc" }
alt-diff = { path = "crates/alt-diff" }
alt-git-codec = { path = "crates/alt-git-codec" }
alt-git-config = { path = "crates/alt-git-config" }
alt-store = { path = "crates/alt-store" }
alt-git-index = { path = "crates/alt-git-index" }
alt-git-pack = { path = "crates/alt-git-pack" }
alt-deflate = { path = "crates/alt-deflate" }
alt-hash = { path = "crates/alt-hash" }
alt-inflate = { path = "crates/alt-inflate" }
alt-export = { path = "crates/alt-export" }
alt-flow = { path = "crates/alt-flow" }
alt-git-refs = { path = "crates/alt-git-refs" }
alt-lfs = { path = "crates/alt-lfs" }
alt-import = { path = "crates/alt-import" }
alt-merge = { path = "crates/alt-merge" }
alt-odb = { path = "crates/alt-odb" }
alt-oplog = { path = "crates/alt-oplog" }
alt-pack-segment = { path = "crates/alt-pack-segment" }
alt-prism = { path = "crates/alt-prism" }
alt-prism-deflate = { path = "crates/alt-prism-deflate" }
alt-prism-png = { path = "crates/alt-prism-png" }
alt-prism-store = { path = "crates/alt-prism-store" }
alt-prism-zip = { path = "crates/alt-prism-zip" }
alt-refs = { path = "crates/alt-refs" }
alt-repo = { path = "crates/alt-repo" }
alt-sign = { path = "crates/alt-sign" }
alt-treediff = { path = "crates/alt-treediff" }
alt-wire = { path = "crates/alt-wire" }
alt-wire-http = { path = "crates/alt-wire-http" }
alt-worktree = { path = "crates/alt-worktree" }
alt-testutil = { path = "crates/alt-testutil" }

blake3 = { version = "1", features = ["rayon"] }
bstr = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
encoding_rs = "0.8"
libc = "0.2"
memmap2 = "0.9"
rand_core = { version = "0.6", default-features = false, features = ["std", "getrandom"] }
rayon = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
proc-macro2 = "1"
url = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
tempfile = "3"
tiny_http = { version = "0.12", default-features = false }
thiserror = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[profile.dev]
# line tables only: backtraces keep file and line, and full DWARF is most of
# the size of target/debug
debug = 1
